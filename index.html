<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrankmanGames · Slice 01</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: system-ui, sans-serif; }
      #view { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #e8e8e8; }
      #perf { position: absolute; top: 8px; left: 8px; font: 12px/1.35 ui-monospace, monospace; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 4px; white-space: pre; }
      .hud-bottom { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .hud-bar { position: relative; width: 320px; height: 14px; background: rgba(0,0,0,.6); border-radius: 3px; overflow: hidden; }
      .hud-bar-fill { position: absolute; inset: 0 auto 0 0; width: 100%; }
      .hud-bar.hp .hud-bar-fill { background: #c0392b; }
      .hud-bar.res .hud-bar-fill { background: #2e86de; }
      .hud-bar-text { position: absolute; inset: 0; text-align: center; font: 11px/14px ui-monospace, monospace; }
      .hud-slots { display: flex; gap: 6px; margin-top: 4px; }
      .slot { position: relative; width: 64px; height: 64px; border-radius: 6px; background: #3a4b5c; border: 2px solid #22303d; overflow: hidden; font-size: 11px; }
      .slot.ready { border-color: #d8c26a; }
      .slot.poor { filter: grayscale(1) brightness(.55); }
      .slot-label { position: absolute; inset: 6px 4px auto 4px; text-align: center; line-height: 1.15; }
      .slot-sweep { position: absolute; inset: 0; }
      .slot-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: bold 15px ui-monospace, monospace; text-shadow: 0 0 3px #000; }
      .slot-key { position: absolute; left: 3px; bottom: 2px; font: bold 11px ui-monospace, monospace; color: #f1e3a0; }
      .slot-cost { position: absolute; right: 3px; bottom: 2px; font: 11px ui-monospace, monospace; color: #8fc3ff; }
      .hud-msg { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); font: bold 16px system-ui, sans-serif; color: #ffd27a; text-shadow: 0 0 4px #000; transition: opacity .2s; opacity: 0; }
      .hud-outcome { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); background: rgba(10,12,16,.82); padding: 18px 26px; border-radius: 8px; text-align: center; }
      .hud-outcome-title { font: bold 30px system-ui, sans-serif; margin-bottom: 8px; }
      .hud-outcome-body { font: 13px/1.6 ui-monospace, monospace; white-space: pre; }
      .hud-log { position: absolute; right: 8px; bottom: 8px; font: 12px/1.35 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 4px; white-space: pre; min-width: 180px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"><div id="perf"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
